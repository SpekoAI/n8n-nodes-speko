name: Publish to npm

# n8n rejects verified community nodes published from a local machine as of
# 2026-05-01 — the package must carry an npm provenance statement produced by a
# CI run. This workflow is that CI run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # `npm install`, not `npm ci`, because no package-lock.json is committed
      # yet. Run `npm install` locally once and commit the lockfile, then
      # switch this back to `npm ci` for reproducible release builds.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build

      # Two modes, and the first release is the awkward one.
      #
      # v0.1.0 — the package name does not exist on npm yet, and npm's trusted
      # publisher is configured in *package settings*, so there is nothing to
      # configure until something is published. Add an npm granular automation
      # token as the NPM_TOKEN repo secret and run this workflow once.
      #
      # After that — configure Trusted Publishing on npmjs.com for this repo and
      # this workflow filename, delete the NPM_TOKEN secret, and delete the two
      # `env:` lines below. `id-token: write` alone is then enough. That is
      # exactly how SpekoAI/typescript-sdk publishes @spekoai/sdk today.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
