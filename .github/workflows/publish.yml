name: Publish to npm

# n8n rejects verified community nodes published from a local machine as of
# 2026-05-01 — the package must carry an npm provenance statement produced by a
# CI run. This workflow is that CI run.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # `npm install`, not `npm ci`, because no package-lock.json is committed
      # yet. Run `npm install` locally once and commit the lockfile, then
      # switch this back to `npm ci` for reproducible release builds.
      - run: npm install --no-audit --no-fund

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
