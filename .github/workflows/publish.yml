name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Full reviewed commit SHA on main
        required: true
        type: string
      package_version:
        description: Exact reviewed package version
        required: true
        type: string
      confirm_publish:
        description: Publish this reviewed source and version to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      CONFIRM_PUBLISH: ${{ inputs.confirm_publish }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify approved source and package
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const manifest = require('./package.json');
          assert.equal(process.env.GITHUB_EVENT_NAME, 'workflow_dispatch');
          assert.equal(process.env.GITHUB_REPOSITORY, 'SpekoAI/n8n-nodes-speko');
          assert.equal(process.env.GITHUB_REF, 'refs/heads/main');
          assert.equal(process.env.CONFIRM_PUBLISH, 'true');
          assert.match(process.env.EXPECTED_SOURCE_SHA, /^[0-9a-f]{40}$/);
          assert.equal(process.env.EXPECTED_SOURCE_SHA, process.env.GITHUB_SHA);
          assert.equal(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), process.env.EXPECTED_SOURCE_SHA);
          assert.equal(manifest.name, 'n8n-nodes-speko');
          assert.equal(manifest.repository.url, 'git+https://github.com/SpekoAI/n8n-nodes-speko.git');
          assert.equal(manifest.version, process.env.PACKAGE_VERSION);
          NODE

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.16.0'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.1'

      - name: Pin and verify release tools
        run: |
          npm install --global npm@11.13.0 --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org/
          test "$(node --version)" = 'v24.16.0'
          test "$(npm --version)" = '11.13.0'
          test "$(bun --version)" = '1.3.1'

      - name: Install locked dependencies
        run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org/

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:package

      - name: Pack and verify the release archive
        id: package
        run: |
          git diff --exit-code
          mkdir "$RUNNER_TEMP/n8n-release"
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP/n8n-release" > "$RUNNER_TEMP/n8n-pack.json"
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { execFileSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { appendFileSync, readFileSync, readdirSync } = require('node:fs');
          const path = require('node:path');
          const manifest = require('./package.json');
          const records = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'n8n-pack.json'), 'utf8'));
          assert.equal(records.length, 1);
          const archive = records[0];
          assert.equal(archive.name, 'n8n-nodes-speko');
          assert.equal(archive.version, process.env.PACKAGE_VERSION);
          assert.equal(archive.filename, `n8n-nodes-speko-${process.env.PACKAGE_VERSION}.tgz`);
          const directory = path.join(process.env.RUNNER_TEMP, 'n8n-release');
          assert.deepEqual(readdirSync(directory), [archive.filename]);
          const archivePath = path.join(directory, archive.filename);
          const packed = JSON.parse(execFileSync('tar', ['-xOf', archivePath, 'package/package.json'], { encoding: 'utf8' }));
          assert.deepEqual(packed, manifest);
          const files = new Set(archive.files.map(({ path }) => path));
          const entries = new Set(execFileSync('tar', ['-tzf', archivePath], { encoding: 'utf8' }).trim().split('\n'));
          for (const entry of [...manifest.n8n.credentials, ...manifest.n8n.nodes]) {
            assert.ok(files.has(entry), `Missing n8n entry: ${entry}`);
            assert.ok(entries.has(`package/${entry}`), `Missing archived n8n entry: ${entry}`);
          }
          const bytes = readFileSync(archivePath);
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          assert.equal(archive.integrity, integrity);
          appendFileSync(process.env.GITHUB_OUTPUT, `archive_path=${archivePath}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Package: ${manifest.name}@${manifest.version}\n\nSource: ${process.env.EXPECTED_SOURCE_SHA}\n\nArchive integrity: ${integrity}\n`);
          NODE

      # Configure npm Trusted Publisher for SpekoAI/n8n-nodes-speko,
      # workflow publish.yml, environment npm. No npm token is used.
      - name: Publish the verified archive with provenance
        env:
          ARCHIVE_PATH: ${{ steps.package.outputs.archive_path }}
        run: npm publish "$ARCHIVE_PATH" --ignore-scripts --provenance --access public --registry=https://registry.npmjs.org/
